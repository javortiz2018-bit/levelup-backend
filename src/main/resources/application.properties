# Puerto del servidor Backend
server.port=8080

# Conexión híbrida (funciona en tu PC local y en contenedores Docker sin cambiar código)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/levelup_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:levelup}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validación de esquema (verifica que Java coincida con tus 7 tablas sin modificar tus triggers ni constraints)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true